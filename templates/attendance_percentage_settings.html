<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance % Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f0f4fa; padding: 2rem 1.5rem; color: #0b1e33; }
        .container { max-width: 560px; margin: 0 auto; }
        .card { background: white; border-radius: 24px; padding: 2rem; box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
        h1 { font-size: 1.4rem; color: #0b2b4a; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.5rem; }
        h1 i { color: #2563eb; }
        .subtitle { color: #6b7f99; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .big-number { font-size: 3rem; font-weight: 700; color: #2563eb; text-align: center; margin: 1rem 0; }
        input { width: 100%; padding: 0.9rem; border: 1.5px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 1.1rem; text-align: center; background: #f8fafd; outline: none; margin-bottom: 1.2rem; }
        input:focus { border-color: #2563eb; background: white; }
        .btn {
            width: 100%; padding: 0.9rem; background: #0b2b4a; color: white;
            border: none; border-radius: 40px; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn:hover { background: #1a3f62; }
        .alert { background: #dcfce7; color: #15803d; padding: 0.9rem 1.2rem; border-radius: 12px; margin-bottom: 1rem; }
        .alert.error { background: #fee2e2; color: #dc2626; }
        .back { display: inline-flex; align-items: center; gap: 0.4rem; color: #2563eb; text-decoration: none; font-size: 0.9rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <a href="{% url 'admin_dashboard' %}" class="back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    <div class="card">
        <h1><i class="fas fa-percent"></i> Attendance Percentage</h1>
        <p class="subtitle">Default minimum attendance required for eligibility</p>

        {% if messages %}
            {% for m in messages %}<div class="alert">{{ m }}</div>{% endfor %}
        {% endif %}

        <div class="big-number">{{ college.attendance_percentage }}%</div>

        <form method="POST">
            {% csrf_token %}
            <input type="number" name="attendance_percentage" value="{{ college.attendance_percentage }}" min="0" max="100" step="1" required>
            <button type="submit" class="btn"><i class="fas fa-save"></i> Update Percentage</button>
        </form>
    </div>
</div>
</body>
</html>
