<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Attendance Management</title>

    <!-- Google Font & Font Awesome for modern icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: linear-gradient(145deg, #eef4fa 0%, #dce6f2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #0b1e33;
        }

        /* ----- modern card (glass-like) ----- */
        .signup-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 2.6rem 2.2rem 2.8rem;
            border-radius: 36px;
            box-shadow:
                0 20px 40px -12px rgba(11, 43, 74, 0.25),
                0 8px 24px -6px rgba(0, 20, 40, 0.06),
                inset 0 1px 1px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease, box-shadow 0.25s ease;
        }

        .signup-container:hover {
            transform: translateY(-3px);
            box-shadow: 0 28px 48px -14px rgba(11, 43, 74, 0.28);
        }

        /* ----- header ----- */
        .signup-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .signup-header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            margin-bottom: 0.3rem;
        }

        .signup-header h1 i {
            color: #2563eb;
            font-size: 1.8rem;
            background: rgba(37, 99, 235, 0.08);
            padding: 0.4rem 0.6rem;
            border-radius: 18px;
        }

        .subtitle {
            text-align: center;
            color: #4a6a8a;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        .subtitle i {
            opacity: 0.6;
            margin-right: 0.2rem;
        }

        /* ----- form groups ----- */
        .form-group {
            margin-bottom: 1.4rem;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1a3650;
            margin-bottom: 0.4rem;
        }

        .form-group label i {
            color: #2563eb;
            font-size: 0.95rem;
            width: 1.2rem;
            opacity: 0.8;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 3rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            background: #f8fafd;
            transition: all 0.2s ease;
            color: #0b1e33;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.01);
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10), inset 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        input::placeholder {
            color: #a8bbd4;
            font-weight: 400;
            font-size: 0.9rem;
        }

        /* ----- button ----- */
        .btn-signup {
            width: 100%;
            padding: 0.95rem 1.2rem;
            margin-top: 0.5rem;
            background: #0b2b4a;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 18px -8px rgba(11, 43, 74, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-signup i {
            font-size: 1rem;
            transition: transform 0.2s ease;
        }

        .btn-signup:hover {
            background: #1a3f62;
            transform: scale(1.01) translateY(-2px);
            box-shadow: 0 16px 28px -10px rgba(11, 43, 74, 0.4);
        }

        .btn-signup:active {
            transform: scale(0.97);
        }

        .btn-signup:hover i {
            transform: translateX(4px);
        }

        /* ----- login link (extra UX) ----- */
        .login-link {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.95rem;
            color: #3d5a79;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            padding-top: 1.6rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .login-link a {
            color: #0b2b4a;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: all 0.2s ease;
            background: rgba(11, 43, 74, 0.04);
        }

        .login-link a i {
            font-size: 0.8rem;
        }

        .login-link a:hover {
            background: rgba(11, 43, 74, 0.08);
            color: #0b2b4a;
            transform: translateX(2px);
        }

        /* ----- messages / errors (if any) ----- */
        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 1.2rem 0;
        }

        .messages li {
            background: #fef2f2;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            color: #b91c1c;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-left: 4px solid #b91c1c;
        }

        .messages li i {
            color: #b91c1c;
        }

        .error {
            color: #b91c1c;
            background: #fef2f2;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1.2rem;
            border-left: 4px solid #b91c1c;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .error i {
            color: #b91c1c;
        }

        /* ----- responsive ----- */
        @media (max-width: 480px) {
            .signup-container {
                padding: 1.8rem 1.5rem 2rem;
                border-radius: 28px;
                margin: 1rem;
            }

            .signup-header h1 {
                font-size: 1.7rem;
            }

            input {
                padding: 0.75rem 1rem 0.75rem 2.8rem;
                font-size: 0.9rem;
            }

            .btn-signup {
                font-size: 0.95rem;
                padding: 0.85rem 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- ===== SIGNUP CARD ===== -->
    <div class="signup-container">

        <div class="signup-header">
            <h1>
                <i class="fas fa-user-plus"></i>
                Create Account
            </h1>
            <p class="subtitle">
                <i class="fas fa-id-card"></i>
                Join the Attendance Management System
            </p>
        </div>

        <!-- error block (exactly as original) -->
        {% if error %}
        <p class="error">
            <i class="fas fa-circle-exclamation"></i>
            {{ error }}
        </p>
        {% endif %}

        <!-- messages block (exactly as original) -->
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li><i class="fas fa-circle-exclamation"></i> {{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <!-- ===== SIGNUP FORM ===== (action, method, csrf, fields unchanged) -->
        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}

            <h3>Your Account</h3>

            <div class="form-group">
                <label>Login ID</label>
                <input type="text" name="login_id" value="{{ login_id|default:'' }}" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <h3>Your College</h3>

            <div class="form-group">
                <label>College Name</label>
                <input type="text" name="college_name" value="{{ college_name|default:'' }}"
                    placeholder="e.g., ABC Institute of Technology" required>
            </div>

            <div class="form-group">
                <label>College ID</label>
                <input type="text" name="college_id" value="{{ college_id|default:'' }}" placeholder="e.g., ABC001"
                    required>
            </div>

            <div class="form-group">
                <label>Email (optional)</label>
                <input type="email" name="email" value="{{ email|default:'' }}">
            </div>

            <button type="submit">Create Account</button>
        </form>

        <!-- login link (extra UX, no logic change) -->
        <div class="login-link">
            <span>Already have an account?</span>
            <a href="{% url 'login' %}">
                <i class="fas fa-arrow-right-to-bracket"></i> Login
            </a>
        </div>

    </div>

</body>

</html>
