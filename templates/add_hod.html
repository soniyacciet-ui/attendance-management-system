<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign HOD | Attendance System</title>

    <!-- Google Font & Font Awesome for modern icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: linear-gradient(145deg, #eef4fa 0%, #dce6f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #0b1e33;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        /* ----- back link (modern) ----- */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.5rem 1rem 0.5rem 0.2rem;
            border-radius: 40px;
            transition: all 0.2s ease;
            background: rgba(37, 99, 235, 0.04);
            margin-bottom: 0.2rem;
        }

        .back-link i {
            font-size: 0.9rem;
            transition: transform 0.2s ease;
        }

        .back-link:hover {
            background: rgba(37, 99, 235, 0.08);
            color: #1d4ed8;
        }

        .back-link:hover i {
            transform: translateX(-4px);
        }

        /* ----- main card (glass-like) ----- */
        .card {
            background: #ffffff;
            margin-top: 0.8rem;
            padding: 2.6rem 2.4rem 2.8rem;
            border-radius: 36px;
            box-shadow: 
                0 20px 40px -12px rgba(11, 43, 74, 0.20),
                0 8px 24px -6px rgba(0, 20, 40, 0.06),
                inset 0 1px 1px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 28px 48px -14px rgba(11, 43, 74, 0.25);
        }

        /* ----- header ----- */
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.3rem;
        }

        .card-header i {
            font-size: 1.8rem;
            color: #2563eb;
            background: rgba(37, 99, 235, 0.08);
            padding: 0.5rem 0.6rem;
            border-radius: 18px;
        }

        .card-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0b2b4a;
            margin: 0;
        }

        .subtitle {
            color: #4a6a8a;
            font-size: 0.95rem;
            font-weight: 400;
            margin: 0.2rem 0 1.8rem 0;
            padding-left: 3.2rem;
            letter-spacing: 0.01em;
        }

        /* ----- department badge ----- */
        .department-badge {
            background: #eff6ff;
            padding: 1rem 1.4rem;
            border-radius: 20px;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid rgba(37, 99, 235, 0.08);
            flex-wrap: wrap;
        }

        .department-badge .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .department-badge .label i {
            color: #2563eb;
            font-size: 0.9rem;
        }

        .department-badge .dept-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2563eb;
            background: rgba(37, 99, 235, 0.06);
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(37, 99, 235, 0.08);
        }

        /* ----- error ----- */
        .error {
            background: #fef2f2;
            color: #b91c1c;
            padding: 0.85rem 1.2rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-left: 4px solid #b91c1c;
        }

        .error i {
            color: #b91c1c;
            font-size: 1rem;
        }

        /* ----- form groups ----- */
        .form-group {
            margin-bottom: 1.4rem;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1a3650;
            margin-bottom: 0.4rem;
        }

        .form-group label i {
            color: #2563eb;
            font-size: 0.95rem;
            width: 1.2rem;
            opacity: 0.8;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 3rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            background: #f8fafd;
            transition: all 0.2s ease;
            color: #0b1e33;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.01);
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10), inset 0 2px 6px rgba(0,0,0,0.02);
        }

        input::placeholder {
            color: #a8bbd4;
            font-weight: 400;
            font-size: 0.9rem;
        }

        /* ----- button ----- */
        .btn-assign {
            width: 100%;
            padding: 0.95rem 1.2rem;
            margin-top: 0.5rem;
            border: none;
            border-radius: 40px;
            background: #0b2b4a;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 18px -8px rgba(11, 43, 74, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-assign i {
            font-size: 1rem;
            transition: transform 0.2s ease;
        }

        .btn-assign:hover {
            background: #1a3f62;
            transform: scale(1.01) translateY(-2px);
            box-shadow: 0 16px 28px -10px rgba(11, 43, 74, 0.4);
        }

        .btn-assign:active {
            transform: scale(0.97);
        }

        .btn-assign:hover i {
            transform: translateX(4px);
        }

        /* ----- responsive ----- */
        @media (max-width: 600px) {
            .card {
                padding: 1.8rem 1.5rem 2rem;
                border-radius: 28px;
            }
            .card-header h1 {
                font-size: 1.5rem;
            }
            .subtitle {
                padding-left: 0;
                font-size: 0.9rem;
            }
            .department-badge {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.4rem;
                padding: 1rem;
            }
            .department-badge .dept-name {
                font-size: 1rem;
                padding: 0.1rem 1rem;
            }
            input {
                padding: 0.75rem 1rem 0.75rem 2.8rem;
                font-size: 0.9rem;
            }
            .btn-assign {
                font-size: 0.95rem;
                padding: 0.85rem 1rem;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 1.5rem 1.2rem 1.8rem;
            }
            .card-header i {
                font-size: 1.4rem;
                padding: 0.3rem 0.4rem;
            }
            .card-header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Back link (original href preserved) -->
    <a href="{% url 'department_details' department.id %}" class="back-link">
        <i class="fas fa-arrow-left"></i>
        Back to Department
    </a>

    <!-- ===== MAIN CARD ===== -->
    <div class="card">

        <div class="card-header">
            <i class="fas fa-user-tie"></i>
            <h1>Assign HOD</h1>
        </div>

        <p class="subtitle">
            <i class="fas fa-id-card" style="opacity:0.5; margin-right:0.3rem;"></i>
            Create the HOD account for this department
        </p>

        <!-- Department badge (original data) -->
        <div class="department-badge">
            <span class="label">
                <i class="fas fa-building-columns"></i> Department
            </span>
            <span class="dept-name">
                {{ department.name }}
            </span>
        </div>

        <!-- Error block (exactly as original) -->
        {% if error %}
            <div class="error">
                <i class="fas fa-circle-exclamation"></i>
                {{ error }}
            </div>
        {% endif %}

        <!-- ===== FORM ===== (action, method, csrf, fields unchanged) -->
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="hodName">
                    <i class="fas fa-user"></i> HOD Name
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-user-pen"></i>
                    <input
                        type="text"
                        name="name"
                        id="hodName"
                        placeholder="Enter HOD name"
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="hodId">
                    <i class="fas fa-id-badge"></i> HOD ID
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-hashtag"></i>
                    <input
                        type="text"
                        name="hod_id"
                        id="hodId"
                        placeholder="Example: HOD001"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="hodPassword">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-key"></i>
                    <input
                        type="password"
                        name="password"
                        id="hodPassword"
                        placeholder="Create password"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn-assign">
                <span>Assign HOD</span>
                <i class="fas fa-arrow-right"></i>
            </button>

        </form>

    </div>

</div>

</body>
</html>
