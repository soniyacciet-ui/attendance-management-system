<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Rules</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f0f4fa; padding: 2rem 1.5rem; color: #0b1e33; }
        .container { max-width: 720px; margin: 0 auto; }
        .card { background: white; border-radius: 24px; padding: 2rem; box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
        h1 { font-size: 1.4rem; color: #0b2b4a; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.5rem; }
        h1 i { color: #f59e0b; }
        .subtitle { color: #6b7f99; font-size: 0.9rem; margin-bottom: 1.5rem; }
        textarea { width: 100%; padding: 1rem; border: 1.5px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 0.95rem; background: #f8fafd; outline: none; min-height: 240px; resize: vertical; line-height: 1.6; }
        textarea:focus { border-color: #2563eb; background: white; }
        .btn {
            width: 100%; padding: 0.9rem; background: #0b2b4a; color: white;
            border: none; border-radius: 40px; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            margin-top: 1rem;
        }
        .btn:hover { background: #1a3f62; }
        .alert { background: #dcfce7; color: #15803d; padding: 0.9rem 1.2rem; border-radius: 12px; margin-bottom: 1rem; }
        .back { display: inline-flex; align-items: center; gap: 0.4rem; color: #2563eb; text-decoration: none; font-size: 0.9rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <a href="{% url 'admin_dashboard' %}" class="back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    <div class="card">
        <h1><i class="fas fa-gavel"></i> Attendance Rules</h1>
        <p class="subtitle">Define custom rules for your college (visible to staff/HODs)</p>

        {% if messages %}
            {% for m in messages %}<div class="alert">{{ m }}</div>{% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <textarea name="rules" placeholder="Example:
1. Minimum 75% attendance required for exam eligibility.
2. Medical leave must be submitted within 3 days.
3. Late arrivals after 10 minutes count as absent.
4. Proxy attendance will result in disciplinary action.">{{ rules }}</textarea>
            <button type="submit" class="btn"><i class="fas fa-save"></i> Save Rules</button>
        </form>
    </div>
</div>
</body>
</html>
