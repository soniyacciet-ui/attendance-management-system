<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add College | Attendance System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4fa;
            color: #0b1e33;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 560px;
            border-radius: 28px;
            padding: 2.4rem 2.2rem 2.6rem;
            box-shadow: 0 20px 40px -12px rgba(11, 43, 74, 0.15);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }
        .back {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #2563eb;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
        }
        h1 {
            font-size: 1.6rem;
            color: #0b2b4a;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        h1 i { color: #2563eb; }
        .subtitle {
            color: #6b7f99;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }
        .alert {
            padding: 0.9rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .alert.success { background: #dcfce7; color: #15803d; border-left: 4px solid #22c55e; }
        .alert.error { background: #fee2e2; color: #dc2626; border-left: 4px solid #dc2626; }
        .form-group { margin-bottom: 1.2rem; }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #6b7f99;
            margin-bottom: 0.4rem;
            letter-spacing: 0.04em;
        }
        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            background: #f8fafd;
            outline: none;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.06);
        }
        .btn {
            width: 100%;
            padding: 0.9rem;
            background: #0b2b4a;
            color: white;
            border: none;
            border-radius: 40px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #1a3f62;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -8px rgba(11, 43, 74, 0.3);
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 480px) {
            .card { padding: 1.8rem 1.5rem; }
            h1 { font-size: 1.3rem; }
            .row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="card">

    <a href="{% url 'manage_colleges' %}" class="back">
        <i class="fas fa-arrow-left"></i> Back to Colleges
    </a>

    <h1>
        <i class="fas fa-building-columns"></i>
        Add New College
    </h1>
    <p class="subtitle">Create a new college with isolated data.</p>

    {% if messages %}
        {% for m in messages %}
            <div class="alert success">{{ m }}</div>
        {% endfor %}
    {% endif %}

    {% if error %}
        <div class="alert error">
            <i class="fas fa-circle-exclamation"></i>
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>College Name *</label>
            <input type="text" name="name" placeholder="e.g., ABC Institute of Technology" required autofocus>
        </div>

        <div class="row">
            <div class="form-group">
                <label>College ID *</label>
                <input type="text" name="college_id" placeholder="e.g., ABC001" required>
            </div>

            <div class="form-group">
                <label>Attendance % Required</label>
                <input type="number" name="attendance_percentage" value="75" min="0" max="100">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Email (optional)</label>
                <input type="email" name="email" placeholder="admin@college.edu">
            </div>

            <div class="form-group">
                <label>Phone (optional)</label>
                <input type="text" name="phone" placeholder="+91 XXXXX XXXXX">
            </div>
        </div>

        <button type="submit" class="btn">
            <i class="fas fa-plus"></i>
            Create College
        </button>
    </form>

</div>
</body>
</html>
