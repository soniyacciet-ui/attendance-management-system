<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Attendance Management</title>

    <!-- Google Font & Font Awesome for modern icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: linear-gradient(145deg, #eef4fa 0%, #dce6f2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #0b1e33;
        }

        /* ----- modern navigation ----- */
        nav {
            height: 72px;
            background: #0b2b4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.5rem;
            box-shadow: 0 6px 18px rgba(0, 20, 40, 0.12);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: white;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo i {
            font-size: 1.6rem;
            color: #7bb3ff;
            background: rgba(255, 255, 255, 0.06);
            padding: 0.4rem 0.5rem;
            border-radius: 14px;
        }

        nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        nav a i {
            font-size: 0.9rem;
        }

        nav a:hover {
            color: white;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ----- login card (glass-like) ----- */
        .login-container {
            width: 100%;
            max-width: 420px;
            margin: 3rem auto 4rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            background: #ffffff;
            padding: 2.5rem 2.2rem 2.8rem;
            border-radius: 36px;
            box-shadow: 
                0 20px 40px -12px rgba(11, 43, 74, 0.25),
                0 8px 24px -6px rgba(0, 20, 40, 0.06),
                inset 0 1px 1px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.2s ease, box-shadow 0.25s ease;
            flex-shrink: 0;
        }

        .login-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 28px 48px -14px rgba(11, 43, 74, 0.28);
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0b2b4a;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .login-header h1 i {
            color: #2563eb;
            font-size: 1.8rem;
            background: rgba(37, 99, 235, 0.08);
            padding: 0.4rem 0.6rem;
            border-radius: 18px;
        }

        .subtitle {
            text-align: center;
            color: #4a6a8a;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* ----- form elements ----- */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1a3650;
            margin-bottom: 0.4rem;
        }

        .form-group label i {
            color: #2563eb;
            font-size: 0.95rem;
            width: 1.2rem;
            opacity: 0.8;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 3rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            background: #f8fafd;
            transition: all 0.2s ease;
            color: #0b1e33;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.01);
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10), inset 0 2px 6px rgba(0,0,0,0.02);
        }

        input::placeholder {
            color: #a8bbd4;
            font-weight: 400;
            font-size: 0.9rem;
        }

        /* ----- error & messages ----- */
        .error,
        .messages p {
            color: #b91c1c;
            background: #fef2f2;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1.2rem;
            border-left: 4px solid #b91c1c;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .messages p i {
            color: #b91c1c;
        }

        /* ----- button ----- */
        .btn-login {
            width: 100%;
            padding: 0.95rem 1.2rem;
            margin-top: 0.8rem;
            background: #0b2b4a;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 18px -8px rgba(11, 43, 74, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-login i {
            font-size: 1rem;
            transition: transform 0.2s ease;
        }

        .btn-login:hover {
            background: #1a3f62;
            transform: scale(1.01) translateY(-2px);
            box-shadow: 0 16px 28px -10px rgba(11, 43, 74, 0.4);
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        .btn-login:hover i {
            transform: translateX(4px);
        }

        /* ----- signup link ----- */
        .signup-link {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.95rem;
            color: #3d5a79;
            border-top: 1px solid rgba(0,0,0,0.04);
            padding-top: 1.6rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .signup-link a {
            color: #0b2b4a;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            transition: all 0.2s ease;
            background: rgba(11, 43, 74, 0.04);
        }

        .signup-link a i {
            font-size: 0.8rem;
        }

        .signup-link a:hover {
            background: rgba(11, 43, 74, 0.08);
            color: #0b2b4a;
            transform: translateX(2px);
        }

        /* ----- responsive ----- */
        @media (max-width: 480px) {
            nav {
                padding: 0 1.2rem;
                height: 64px;
            }
            .logo {
                font-size: 1.1rem;
            }
            nav a {
                padding: 0.4rem 1rem;
                font-size: 0.85rem;
            }
            .login-container {
                margin: 2rem 1rem;
                padding: 1.8rem 1.5rem 2rem;
                border-radius: 28px;
            }
            .login-header h1 {
                font-size: 1.7rem;
            }
            input {
                padding: 0.75rem 1rem 0.75rem 2.8rem;
                font-size: 0.9rem;
            }
        }

        /* ----- extra polish for messages from Django ----- */
        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 1.2rem 0;
        }
        .messages li {
            background: #fef2f2;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            color: #b91c1c;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-left: 4px solid #b91c1c;
        }
        .messages li i {
            color: #b91c1c;
        }
    </style>
</head>

<body>

    <!-- ===== NAV ===== (no logic change) -->
    <nav>
        <div class="logo">
            <i class="fas fa-clipboard-check"></i>
            Attendance Management
        </div>
        <a href="{% url 'home' %}">
            <i class="fas fa-house"></i> Home
        </a>
    </nav>

    <!-- ===== LOGIN CARD ===== -->
    <div class="login-container">

        <div class="login-header">
            <h1>
                <i class="fas fa-arrow-right-to-bracket"></i>
                Login
            </h1>
            <p class="subtitle">
                <i class="fas fa-user-circle" style="opacity:0.6;"></i>
                Login to your account
            </p>
        </div>

        <!-- error block (exactly as original) -->
        {% if error %}
            <p class="error">
                <i class="fas fa-circle-exclamation"></i>
                {{ error }}
            </p>
        {% endif %}

        <!-- messages block (exactly as original) -->
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li><i class="fas fa-circle-exclamation"></i> {{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <!-- ===== LOGIN FORM ===== (action, method, csrf, fields unchanged) -->
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-user-pen"></i>
                    <input 
                        type="text" 
                        name="username" 
                        id="username" 
                        placeholder="Enter your username" 
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-key"></i>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        placeholder="Enter your password" 
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn-login">
                <span>Login</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="signup-link">
            <span>Don't have an account?</span>
            <a href="{% url 'signup' %}">
                <i class="fas fa-user-plus"></i> Sign Up
            </a>
        </div>

    </div>

</body>
</html>
