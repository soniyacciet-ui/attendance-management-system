<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise Request</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f0f4fa; padding: 2rem 1.5rem; color: #0b1e33; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; border-radius: 24px; padding: 2.2rem; max-width: 500px; width: 100%; box-shadow: 0 20px 40px -12px rgba(11,43,74,0.15); }
        h1 { font-size: 1.4rem; color: #0b2b4a; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.6rem; }
        h1 i { color: #f59e0b; }
        .subtitle { color: #6b7f99; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .info-box { background: #eff6ff; padding: 1.2rem 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; }
        .info-box strong { color: #0b2b4a; display: block; margin-bottom: 0.3rem; }
        .info-box span { color: #2563eb; font-size: 0.9rem; }
        textarea { width: 100%; padding: 1rem; border: 1.5px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 0.95rem; background: #f8fafd; resize: vertical; min-height: 120px; outline: none; }
        textarea:focus { border-color: #2563eb; background: white; box-shadow: 0 0 0 4px rgba(37,99,235,0.06); }
        label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #6b7f99; margin-bottom: 0.4rem; }
        .btn-row { display: flex; gap: 0.6rem; margin-top: 1.5rem; }
        .btn { flex: 1; padding: 0.9rem; border: none; border-radius: 40px; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-cancel { background: #f1f4f9; color: #374151; border: 1px solid #e2e8f0; }
        .btn-submit { background: #0b2b4a; color: white; }
        .btn-submit:hover { background: #1a3f62; }
    </style>
</head>
<body>
<div class="card">

    <h1><i class="fas fa-hand-paper"></i> Raise Correction Request</h1>
    <p class="subtitle">Tell your teacher why you were actually present.</p>

    <div class="info-box">
        <strong>{{ attendance.date|date:"l, d M Y" }}</strong>
        <span>
            {{ attendance.subject.name|default:"—" }}
            {% if attendance.period %} · Period {{ attendance.period.number }}{% endif %}
            · Currently marked <strong style="color:#dc2626;display:inline;">ABSENT</strong>
        </span>
    </div>

    <form method="POST">
        {% csrf_token %}
        <label for="reason">Why were you present? *</label>
        <textarea
            name="reason"
            id="reason"
            placeholder="Example: I was in class but my roll number was missed during attendance. My friend Ravi can confirm."
            required
        ></textarea>

        <div class="btn-row">
            <a href="{% url 'student_portal' %}" class="btn btn-cancel">
                <i class="fas fa-times"></i> Cancel
            </a>
            <button type="submit" class="btn btn-submit">
                <i class="fas fa-paper-plane"></i> Submit Request
            </button>
        </div>
    </form>

</div>
</body>
</html>
