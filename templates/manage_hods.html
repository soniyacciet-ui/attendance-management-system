<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage HODs | {{ college.name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f0f4fa; padding: 2rem 1.5rem; color: #0b1e33; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header {
            background: white; padding: 1.5rem 2rem; border-radius: 20px;
            margin-bottom: 1.5rem; box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
        }
        .header h1 { font-size: 1.5rem; color: #0b2b4a; display: flex; align-items: center; gap: 0.6rem; }
        .header h1 i { color: #f59e0b; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.6rem 1.2rem; background: #0b2b4a; color: white;
            text-decoration: none; border-radius: 40px; font-size: 0.85rem; font-weight: 500;
        }
        .btn:hover { background: #1a3f62; }
        .btn-outline { background: transparent; color: #0b2b4a; border: 1.5px solid #e2e8f0; }
        .card {
            background: white; border-radius: 20px; padding: 1.5rem 2rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.9rem 0.8rem; text-align: left; border-bottom: 1px solid #f0f4fa; font-size: 0.9rem; }
        th { color: #4a6a8a; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: white; display: inline-flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 0.8rem; margin-right: 0.6rem;
        }
        .empty { text-align: center; padding: 3rem; color: #94a3b8; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-user-tie"></i> Manage HODs</h1>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="card">
        {% if hods %}
        <table>
            <thead>
                <tr>
                    <th>HOD</th>
                    <th>Username</th>
                    <th>Department</th>
                </tr>
            </thead>
            <tbody>
                {% for h in hods %}
                <tr>
                    <td>
                        <span class="avatar">{{ h.user.get_full_name|default:h.user.username|first|upper }}</span>
                        {{ h.user.get_full_name|default:h.user.username }}
                    </td>
                    <td>{{ h.user.username }}</td>
                    <td>{{ h.department.name }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="empty">
            <i class="fas fa-user-slash" style="font-size:2rem;display:block;margin-bottom:0.5rem;opacity:0.3;"></i>
            No HODs assigned yet.
        </div>
        {% endif %}
    </div>
</div>
</body>
</html>
