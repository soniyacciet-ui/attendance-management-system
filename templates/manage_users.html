<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | {{ college.name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f0f4fa; padding: 2rem 1.5rem; color: #0b1e33; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header {
            background: white; padding: 1.5rem 2rem; border-radius: 20px;
            margin-bottom: 1.5rem; box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { font-size: 1.5rem; color: #0b2b4a; display: flex; align-items: center; gap: 0.6rem; }
        .header h1 i { color: #8b5cf6; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.6rem 1.2rem; background: transparent; color: #0b2b4a;
            text-decoration: none; border-radius: 40px; font-size: 0.85rem; font-weight: 500;
            border: 1.5px solid #e2e8f0;
        }
        .card {
            background: white; border-radius: 20px; padding: 1.5rem 2rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.9rem 0.8rem; text-align: left; border-bottom: 1px solid #f0f4fa; font-size: 0.9rem; }
        th { color: #4a6a8a; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; }
        .role-badge {
            padding: 0.25rem 0.8rem; border-radius: 40px;
            font-size: 0.7rem; font-weight: 600;
        }
        .role-ADMIN { background: #fee2e2; color: #dc2626; }
        .role-HOD { background: #fffbeb; color: #b45309; }
        .role-STAFF { background: #e0e7ff; color: #4f46e5; }
        .role-STUDENT { background: #dbeafe; color: #1e40af; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-users"></i> Manage Users</h1>
        <a href="{% url 'admin_dashboard' %}" class="btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="card">
        {% if users %}
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Role</th>
                </tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td><strong>{{ u.username }}</strong></td>
                    <td>{{ u.get_full_name|default:"—" }}</td>
                    <td>{{ u.email|default:"—" }}</td>
                    <td>
                        {% if u.userprofile %}
                            <span class="role-badge role-{{ u.userprofile.role }}">
                                {{ u.userprofile.role }}
                            </span>
                        {% else %}
                            <span style="color:#94a3b8;">—</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p style="text-align:center;padding:3rem;color:#94a3b8;">No users found.</p>
        {% endif %}
    </div>
</div>
</body>
</html>
