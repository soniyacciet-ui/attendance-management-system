<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Parent | Attendance System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #eef4fa, #dce6f2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: white;
            padding: 2.5rem 2.2rem;
            border-radius: 32px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 40px -12px rgba(11,43,74,0.2);
            border: 1px solid rgba(255,255,255,0.5);
        }
        h1 {
            font-size: 1.6rem;
            color: #0b2b4a;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        h1 i { color: #2563eb; }
        .subtitle {
            color: #6b7f99;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .student-badge {
            background: #eff6ff;
            padding: 0.8rem 1.2rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #1e40af;
            border: 1px solid #dbeafe;
        }
        .student-badge strong {
            display: block;
            color: #0b2b4a;
            font-size: 1rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a3650;
            margin-bottom: 0.4rem;
        }
        input, select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.9rem;
            background: #f8fafd;
            color: #0b1e33;
            outline: none;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.08);
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }
        .checkbox-row input {
            width: auto;
        }
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: #0b2b4a;
            color: white;
            border: none;
            border-radius: 40px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        .btn-submit:hover {
            background: #1a3f62;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -8px rgba(11,43,74,0.3);
        }
        .error {
            background: #fef2f2;
            color: #b91c1c;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            border-left: 4px solid #b91c1c;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #2563eb;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 1.2rem;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1><i class="fas fa-user-plus"></i> Add Parent</h1>
        <p class="subtitle">Register a parent / guardian for notifications</p>

        <div class="student-badge">
            <strong>{{ student.user.get_full_name|default:student.user.username }}</strong>
            Reg: {{ student.register_number }} · {{ student.department.name }}
        </div>

        {% if error %}
            <div class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Parent Name *</label>
                <input type="text" name="name" required placeholder="Full name" autofocus>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required placeholder="parent@email.com">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="+91 XXXXX XXXXX">
            </div>

            <div class="form-group">
                <label>Relationship</label>
                <select name="relationship">
                    <option value="FATHER">Father</option>
                    <option value="MOTHER">Mother</option>
                    <option value="GUARDIAN">Guardian</option>
                </select>
            </div>

            <div class="form-group">
                <label>Preferred Language</label>
                <select name="preferred_language">
                    {% for code, name in languages %}
                        <option value="{{ code }}" {% if code == "en" %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" name="receive_email" id="receive_email" checked>
                <label for="receive_email" style="margin:0;font-weight:500;font-size:0.9rem;">Receive email notifications</label>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-check"></i> Add Parent
            </button>
        </form>

        <a href="{% url 'department_students' student.department.id %}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Students
        </a>
    </div>
</body>
</html>
